# =========================================================
# Append to application.properties ? required for lab uploads.
# Spring Boot's default multipart limit is 1MB, too small for most
# Packet Tracer .pkt/.pka files.
# =========================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# =========================================================
# H2 datasource ? file-based, persists across restarts.
# Replace the existing spring.datasource.* / spring.jpa.* lines in
# your application.properties with these (path changed from
# ./data/secureprovision_db to ./database/network_db as requested).
# =========================================================
spring.datasource.url=jdbc:h2:file:./database/network_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# "update" ? Hibernate creates tables that don't exist yet and adds
# missing columns, but never drops or truncates existing data. This is
# what makes users/roles/lab metadata survive a restart. (Do NOT use
# "create" or "create-drop" ? those wipe the schema on every startup.)
spring.jpa.hibernate.ddl-auto=update

# ---- H2 Web Console (unchanged) ----
# http://localhost:8080/h2-console
# JDBC URL to paste in the console login screen:
#   jdbc:h2:file:./database/network_db
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
